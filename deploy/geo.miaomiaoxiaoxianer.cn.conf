server {
    listen 80;
    listen 443 ssl;
    listen [::]:80;
    listen [::]:443 ssl;
    http2 on;
    server_name geo.miaomiaoxiaoxianer.cn;

    root /www/wwwroot/geo.miaomiaoxiaoxianer.cn;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff|woff2|mp4|pdf)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    #SSL-START
    ssl_certificate    /www/server/panel/vhost/cert/geo.miaomiaoxiaoxianer.cn/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/geo.miaomiaoxiaoxianer.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:EECDH+AES256:RSA+AES128:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497  https://$host$request_uri;
    #SSL-END

    access_log /www/wwwlogs/geo.miaomiaoxiaoxianer.cn.log;
    error_log /www/wwwlogs/geo.miaomiaoxiaoxianer.cn.error.log;
}
